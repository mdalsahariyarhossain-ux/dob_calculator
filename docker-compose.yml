
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dob-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000
    container_name: dob-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
